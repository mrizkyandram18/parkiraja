server:
  port: 8080

spring:
  application:
    name: parkiraja
  datasource:
    url: jdbc:h2:file:./data/parkiraja;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
